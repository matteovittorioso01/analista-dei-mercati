name: Backtest paniere (manuale)

# Si lancia A MANO dalla tab "Actions" (non è programmato): scarica anni di storia
# per un paniere diversificato, prova le strategie a regole, e ti manda via email
# il report che dice se battono il semplice "compra e tieni". Numeri veri, zero codice.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui il backtest del paniere
        run: python backtest/run_basket.py

      - name: Salva il report nel repository
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- backtest/results; then
            git config user.name "market-bot"
            git config user.email "bot@users.noreply.github.com"
            git add backtest/results
            git commit -m "backtest: aggiorna report del paniere"
            git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          fi

      - name: Invia il report via email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "Backtest paniere — strategie a regole"
          to: matteovittorioso@gmail.com
          from: Market Bot
          convert_markdown: true
          html_body: file://backtest/results/latest.md
