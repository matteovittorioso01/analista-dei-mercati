name: Backtest paniere (manuale)

# Si lancia A MANO dalla tab "Actions" (non è programmato). Scarica anni di storia e
# produce DUE report, inviati via email:
#   1) confronto tra panieri diversificati (buy & hold) — rischio/rendimento
#   2) strategie a regole vs comprare e tenere — hanno un vantaggio?
# Numeri veri, zero codice da scrivere.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui il backtest delle strategie a regole
        run: python backtest/run_basket.py

      - name: Esegui il confronto dei panieri diversificati
        run: python backtest/portfolio.py

      - name: Salva i report nel repository
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest/results
          if ! git diff --cached --quiet; then
            git commit -m "backtest: aggiorna report del paniere"
            git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          fi

      - name: Invia via email il confronto dei panieri diversificati
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "Panieri diversificati — confronto storico"
          to: matteovittorioso@gmail.com
          from: Market Bot
          convert_markdown: true
          html_body: file://backtest/results/portfolio.md

      - name: Invia via email il backtest delle strategie a regole
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "Backtest — strategie a regole vs comprare e tenere"
          to: matteovittorioso@gmail.com
          from: Market Bot
          convert_markdown: true
          html_body: file://backtest/results/latest.md
