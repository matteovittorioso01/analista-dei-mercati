name: Sentinella (alert prezzi)

# La Sentinella controlla i prezzi ogni ~5 minuti e invia un alert Telegram
# quando un prezzo tocca un livello definito dall'Analista nella watchlist.

on:
  schedule:
    - cron: "*/5 * * * *"   # ogni 5 minuti, h24
  workflow_dispatch:        # permette anche il lancio manuale dalla tab Actions

permissions:
  contents: write

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla prezzi e invia alert
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sentinel/check.py

      - name: Salva portafoglio simulato (solo se cambiato)
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- state/portfolio.json PORTFOLIO.md; then
            git config user.name "market-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/portfolio.json PORTFOLIO.md
            git commit -m "sentinel: aggiorna portafoglio simulato"
            git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
